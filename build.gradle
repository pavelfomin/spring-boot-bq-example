plugins {
    id 'org.springframework.boot' version "3.5.7"
    id 'io.spring.dependency-management' version "1.1.7"
    id 'java'
    id 'groovy'
    id 'idea'
    id 'nebula.release' version "20.0.2"
    id 'nebula.maven-publish' version "9.0.1"
    id 'jacoco'
    id 'maven-publish'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    springCloudVersion='2025.0.0'
    googleCloudLibrariesVersion='26.71.0'
    springDocVersion='2.8.13'
    logstashLogbackEncoderVersion='9.0'

    spockVersion = '2.4-M1-groovy-4.0'
    testcontainersVersion = '1.20.6'
}

dependencies {
    // spring
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // open api / swagger
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springDocVersion}"

    // google
    implementation platform("com.google.cloud:libraries-bom:${googleCloudLibrariesVersion}")
    implementation 'com.google.cloud:google-cloud-bigquery'

    // Lombok
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Logging
    runtimeOnly "net.logstash.logback:logstash-logback-encoder:${logstashLogbackEncoderVersion}"

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform("org.spockframework:spock-bom:${spockVersion}")
    testImplementation "org.spockframework:spock-spring"
    testImplementation "org.apache.groovy:groovy-json"
    testImplementation 'org.testcontainers:spock'
    testImplementation "org.testcontainers:gcloud"
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

springBoot {
    buildInfo()
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
    afterSuite { desc, result ->
        if (!desc.parent)
            println("${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)")
    }
    finalizedBy jacocoTestReport // report is always generated after tests run
}

jacocoTestReport {
    dependsOn test // tests are required to run before generating the report
    reports {
        xml.required = true
    }
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/pavelfomin/spring-boot-bq-example"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
